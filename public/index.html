```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sterowanie bramą</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 18px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #verification {
            display: none;
        }

        #gateButton {
            display: none;
            background: #16803c;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚪 Brama</h1>

    <!-- LOGOWANIE -->

    <div id="login">

        <input
            id="username"
            type="text"
            placeholder="Login">

        <input
            id="password"
            type="password"
            placeholder="Hasło">

        <button onclick="userLogin()">
            ZALOGUJ
        </button>

    </div>

    <!-- KOD 2FA -->

    <div id="verification">

        <p>
            Kod został wysłany na Gmail.
        </p>

        <input
            id="code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Kod 6-cyfrowy">

        <button onclick="verifyCode()">
            POTWIERDŹ KOD
        </button>

    </div>

    <!-- STEROWANIE BRAMĄ -->

    <button id="gateButton" onclick="openGate()">
        OTWÓRZ BRAMĘ
    </button>

    <p id="message"></p>

</div>

<script>

let token = null;


// ==============================
// LOGOWANIE
// ==============================

async function userLogin() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.innerText = "Logowanie...";

    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        const data = await response.json();

        console.log(data);

        if (data.success) {

            document.getElementById("login").style.display = "none";

            document.getElementById("verification").style.display = "block";

            message.innerText =
                "Wpisz kod otrzymany na Gmail.";

        } else {

            message.innerText =
                data.message || "Błędny login lub hasło.";

        }

    } catch (error) {

        console.error(error);

        message.innerText =
            "Błąd połączenia z serwerem.";

    }
}


// ==============================
// WERYFIKACJA KODU 2FA
// ==============================

async function verifyCode() {

    const code =
        document.getElementById("code").value;

    const message =
        document.getElementById("message");

    message.innerText = "Sprawdzanie kodu...";

    try {

        const response = await fetch("/api/verify-code", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                code: code
            })

        });

        const data = await response.json();

        console.log(data);

        if (data.success) {

            token = data.token;

            document.getElementById("verification").style.display = "none";

            document.getElementById("gateButton").style.display = "block";

            message.innerText =
                "Zalogowano pomyślnie.";

        } else {

            message.innerText =
                data.message || "Nieprawidłowy kod.";

        }

    } catch (error) {

        console.error(error);

        message.innerText =
            "Błąd połączenia z serwerem.";

    }
}


// ==============================
// OTWIERANIE BRAMY
// ==============================

async function openGate() {

    const message =
        document.getElementById("message");

    message.innerText =
        "Wysyłanie komendy...";

    try {

        const response = await fetch("/api/open", {

            method: "POST",

            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }

        });

        const data = await response.json();

        console.log(data);

        if (data.success) {

            message.innerText =
                "Komenda OTWÓRZ została wysłana.";

        } else {

            message.innerText =
                data.message || "Błąd.";

        }

    } catch (error) {

        console.error(error);

        message.innerText =
            "Błąd połączenia z serwerem.";

    }
}

</script>

</body>
</html>
